name: Release

# Cut a release by pushing a semver tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# The job builds the frontend, cross-compiles the server for linux/darwin
# (amd64/arm64), packages each as dvc-cvp_<os>_<arch>.tar.gz (binary named
# `dvc-cvp` plus the built web/dist) and publishes them as release assets.
# These asset names match the portal's self-upgrade default assetPattern
# (dvc-cvp_{os}_{arch}), so the in-app "업그레이드" button can pull them.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::7}"
          BUILDTIME="$(date -u +%FT%TZ)"
          PKG=github.com/noainred/dvc.cvp/internal/version
          LDFLAGS="-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.BuildTime=${BUILDTIME}"
          mkdir -p dist build
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "building ${os}/${arch}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -ldflags "$LDFLAGS" -o build/dvc-cvp ./cmd/server
            tar -czf "dist/dvc-cvp_${os}_${arch}.tar.gz" -C build dvc-cvp -C "$GITHUB_WORKSPACE" web/dist
            rm -f build/dvc-cvp
          done
          ( cd dist && sha256sum *.tar.gz > checksums.txt )
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/dvc-cvp_*.tar.gz
            dist/checksums.txt
