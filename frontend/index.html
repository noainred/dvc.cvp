<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeLab Monitor</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🏠</span>
      <span>HomeLab Monitor</span>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="dashboard">대시보드</button>
      <button class="tab" data-tab="history">업타임 기록</button>
      <button class="tab" data-tab="speed">인터넷 속도</button>
      <button class="tab" data-tab="synology">시놀로지</button>
      <button class="tab" data-tab="routerinfo">공유기</button>
      <button class="tab" data-tab="devices">장비 관리</button>
      <button class="tab" data-tab="settings">설정</button>
    </nav>
    <div class="status-pill" id="globalStatus">연결 중…</div>
  </header>

  <main>
    <!-- 대시보드 -->
    <section id="dashboard" class="page active">
      <div class="cards" id="summaryCards"></div>
      <h2>장비 현황</h2>
      <div class="grid" id="deviceCards"></div>
      <h2>최근 이벤트</h2>
      <table class="data-table" id="eventsTable">
        <thead><tr><th>시간</th><th>장비</th><th>상태</th><th>지속</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- 업타임 기록 -->
    <section id="history" class="page">
      <div class="toolbar">
        <select id="histDevice"></select>
        <div class="rangebtns" id="histRanges">
          <button data-range="24h">24시간</button>
          <button data-range="7d">7일</button>
          <button data-range="30d" class="active">30일</button>
          <button data-range="1y">1년</button>
          <button data-range="3y">3년</button>
        </div>
      </div>
      <div class="cards" id="histStats"></div>
      <div class="chart-box"><canvas id="uptimeChart"></canvas></div>
      <div class="chart-box"><canvas id="latencyChart"></canvas></div>
      <h2>상태 변경 이력</h2>
      <table class="data-table" id="histEvents">
        <thead><tr><th>시간</th><th>상태</th><th>이전 상태 지속</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- 인터넷 속도 -->
    <section id="speed" class="page">
      <div class="toolbar">
        <button class="btn primary" id="runSpeed">▶ 지금 측정</button>
        <span id="speedMsg" class="muted"></span>
        <div class="rangebtns" id="speedRanges">
          <button data-days="7">7일</button>
          <button data-days="30" class="active">30일</button>
          <button data-days="365">1년</button>
          <button data-days="1095">3년</button>
        </div>
      </div>
      <div class="cards" id="speedStats"></div>
      <div class="chart-box"><canvas id="speedChart"></canvas></div>
      <div class="chart-box"><canvas id="pingChart"></canvas></div>
    </section>

    <!-- 시놀로지 -->
    <section id="synology" class="page">
      <div class="toolbar"><button class="btn" id="refreshSyno">새로고침</button></div>
      <div id="synoBody"><p class="muted">불러오는 중…</p></div>
      <div class="chart-box"><canvas id="synoChart"></canvas></div>
    </section>

    <!-- 공유기 -->
    <section id="routerinfo" class="page">
      <div class="toolbar"><button class="btn" id="refreshRouter">새로고침</button></div>
      <div id="routerBody"><p class="muted">불러오는 중…</p></div>
    </section>

    <!-- 장비 관리 -->
    <section id="devices" class="page">
      <div class="toolbar">
        <button class="btn primary" id="addDevice">+ 장비 추가</button>
      </div>
      <table class="data-table" id="deviceTable">
        <thead>
          <tr><th>이름</th><th>호스트/IP</th><th>종류</th><th>체크</th><th>상태</th><th>지연</th><th>사용</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- 설정 -->
    <section id="settings" class="page">
      <form id="settingsForm" class="settings-form"></form>
      <div class="toolbar">
        <button class="btn primary" id="saveSettings">저장</button>
        <span id="settingsMsg" class="muted"></span>
      </div>
    </section>
  </main>

  <!-- 장비 추가/수정 모달 -->
  <div class="modal-backdrop" id="deviceModal">
    <div class="modal">
      <h3 id="deviceModalTitle">장비 추가</h3>
      <form id="deviceForm">
        <input type="hidden" name="id" />
        <label>이름<input name="name" required /></label>
        <label>호스트 / IP<input name="host" required placeholder="192.168.0.1" /></label>
        <label>종류
          <select name="type">
            <option value="router">공유기</option>
            <option value="nas">NAS</option>
            <option value="server">서버</option>
            <option value="pc">PC</option>
            <option value="ap">AP</option>
            <option value="printer">프린터</option>
            <option value="iot">IoT</option>
            <option value="other">기타</option>
          </select>
        </label>
        <label>체크 방식
          <select name="check_method" id="checkMethod">
            <option value="icmp">ICMP (핑)</option>
            <option value="tcp">TCP 포트</option>
            <option value="http">HTTP</option>
          </select>
        </label>
        <label>포트 <input name="check_port" type="number" placeholder="TCP/HTTP 사용 시" /></label>
        <label>메모 <input name="note" /></label>
        <label class="check-row"><input type="checkbox" name="enabled" checked /> 모니터링 사용</label>
        <div class="modal-actions">
          <button type="button" class="btn" id="cancelDevice">취소</button>
          <button type="submit" class="btn primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
